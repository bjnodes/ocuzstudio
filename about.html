      <h1 class="about-lead">ARCHIVE OF CONTEMPORARY VISUAL EXPERIMENTS</h1>
      <p
        class="about-copy"
        data-en="OCUZ STUDIO is a photography studio based in Seoul.<br>We aim to translate each brand’s distinct story and identity into visual language,<br>valuing the process of shaping direction and atmosphere together rather than simply producing outcomes.<br><br>Working across fashion, beauty, and still life, we create images that expand the core of a brand<br>into a clear and resonant visual language."
        data-ko="OCUZ STUDIO는 서울을 기반으로 활동하는 포토그래피 스튜디오입니다.<br>브랜드가 가진 고유한 이야기와 정체성을 시각적으로 풀어내는 작업을 지향하며<br>단순한 결과물 생산보다 브랜드가 전달하고자 하는 방향성과 분위기를 함께 구축하는 과정을 함께합니다.<br><br>패션, 뷰티, 스틸라이프를 중심으로 다양한 작업을 진행하며,<br>브랜드가 가진 본질을 명확한 시각 언어로 확장하는 이미지를 만들어드리겠습니다."
        data-i18n-html="true"
