<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work — Ocuz Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site">
    <nav>
      <div class="nav-left">
        <a href="work.html" class="is-active">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <div class="lang-switch nav-lang-switch" aria-label="Language switcher">
          <a href="#" class="lang-btn" data-set-lang="en">EN</a>
          <a href="#" class="lang-btn" data-set-lang="ko">KOR</a>
        </div>
      </div>
      <div class="nav-right">
        <a href="https://www.behance.net/ocuzstudio" target="_blank">Behance</a>
        <a href="https://www.instagram.com/hayoung.limm" target="_blank">Instagram</a>
        <a href="index.html">ocuz.studio ↗</a>
      </div>
    </nav>

    <div class="grid-section standalone-grid" id="grid"></div>

    <div class="info-section main-info-section">
      <div>
        <div class="info-label" data-en="Curated by" data-ko="큐레이션"></div>
        <div class="info-val" data-en="Hayoung Lim" data-ko="임하영"></div>
      </div>
      <div>
        <div class="info-label" data-en="Based in" data-ko="기반 지역"></div>
        <div class="info-val" data-en="25, Toegyero 41-gil<br>Jung-gu, Seoul<br>Korea" data-ko="서울 중구<br>퇴계로41길 25<br>대한민국" data-i18n-html="true"></div>
      </div>
      <div>
        <div class="info-label" data-en="Type" data-ko="분야"></div>
        <div class="info-val" data-en="Fashion Photography<br>Visual Direction<br>Still Life · Beauty" data-ko="패션 포토그래피<br>비주얼 디렉션<br>스틸라이프 · 뷰티" data-i18n-html="true"></div>
      </div>
    </div>

    <div class="brand-footer main-brand-footer">
      <div class="brand-name">OCUZ</div>
      <div class="brand-sub" data-en="Ocuz Studio <br> Fashion &amp; Photography <br> Seoul" data-ko="오커즈 스튜디오 <br> 패션 앤 포토그래피 <br> 서울" data-i18n-html="true"></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close gallery" data-en="Close" data-ko="닫기"></button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image">Prev</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image">Next</button>
    <div class="lightbox-stage">
      <div class="lightbox-meta">
        <div class="lightbox-title" id="lightbox-title"></div>
        <div class="lightbox-count" id="lightbox-count"></div>
      </div>
      <div class="lightbox-carousel">
        <button class="lightbox-peek lightbox-peek-prev" id="lightbox-peek-prev" aria-label="Previous image preview">
          <span class="lightbox-peek-fade"></span>
          <img class="lightbox-peek-image" id="lightbox-peek-image-prev" src="" alt="">
        </button>
        <div class="lightbox-current">
          <img class="lightbox-image" id="lightbox-image" src="" alt="">
        </div>
        <button class="lightbox-peek lightbox-peek-next" id="lightbox-peek-next" aria-label="Next image preview">
          <span class="lightbox-peek-fade"></span>
          <img class="lightbox-peek-image" id="lightbox-peek-image-next" src="" alt="">
        </button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
